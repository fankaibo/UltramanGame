name: Core and pose bridge checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Synthetic preview and photo test dependencies
        run: python -m pip install numpy==1.26.4 opencv-contrib-python==4.11.0.86
      - name: Camera-free core and loopback integration checks
        run: ./scripts/check.sh
